name: iOS build

# Сборка и запуск приложения на macOS-раннере с Xcode — единственный способ
# проверить проект, если под рукой нет Mac.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Версия Xcode
        run: xcodebuild -version

      - name: Сборка под симулятор
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/KBZHU.xcodeproj \
            -scheme KBZHU \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Запуск в симуляторе и скриншот
        run: |
          set -euo pipefail
          xcrun simctl boot "iPhone 16" || true
          xcrun simctl bootstatus "iPhone 16" -b
          xcrun simctl install booted build/Build/Products/Debug-iphonesimulator/KBZHU.app
          xcrun simctl launch booted com.example.kbzhu
          sleep 8
          xcrun simctl io booted screenshot launch.png

      - name: Скриншот в артефакты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-screenshot
          path: launch.png
          if-no-files-found: warn
